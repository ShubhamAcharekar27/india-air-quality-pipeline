version: 2

models:
  - name: dim_city
    columns:
      - name: city_key
        data_tests:
          - unique
          - not_null

  - name: dim_date
    columns:
      - name: date_day
        data_tests:
          - unique
          - not_null

  - name: fct_air_quality_hourly
    columns:
      - name: reading_id
        data_tests:
          - unique
          - not_null
      - name: city_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_city')
              field: city_key
      - name: date_day
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: aqi_category
        data_tests:
          - accepted_values:
              values: ['Good', 'Moderate', 'Unhealthy for Sensitive Groups', 'Unhealthy', 'Very Unhealthy', 'Hazardous']