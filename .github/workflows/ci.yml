name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            orchestration/requirements-pipeline.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r orchestration/requirements-pipeline.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest

      - name: Generate sample raw data
        run: python tests/generate_sample_data.py

      - name: Load raw data into DuckDB
        run: python load/load_raw.py

      - name: Build and test dbt project
        run: dbt build --profiles-dir .
        working-directory: transform

      - name: Check row counts (proves deduplication)
        run: python tests/check_pipeline_output.py